known_operational_risks:
  - id: R001
    severity: high
    status: open
    description: Repository default branch is still legacy dev; an agent launched without selecting a Superfork branch may miss Superfork instructions.
    mitigation: Change GitHub default branch to superfork/integration after bootstrap is merged; until then select chore/fork-foundation for Gate 0.
  - id: R002
    severity: high
    status: being_fixed_in_bootstrap
    description: Upstream PR build workflow originally targeted dev only and would not run on Superfork PRs.
  - id: R003
    severity: medium
    status: being_fixed_in_bootstrap
    description: Upstream PR-template policy is incompatible with Superfork feature-import PRs.
  - id: R004
    severity: medium
    status: open
    description: GitHub branch protection/rulesets are not configured for superfork/integration.
    mitigation: Configure ruleset after CI jobs exist; until then AGENTS.md forbids direct work/merge.

last_review:
