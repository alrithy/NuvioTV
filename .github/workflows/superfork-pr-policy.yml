name: Superfork PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches:
      - "superfork/integration"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const required = [
              "## Feature",
              "## Source audit",
              "## Changes",
              "## Fallback / feature flag",
              "## Attribution / license",
              "## Tests",
              "## Risks / follow-ups",
            ];
            const missing = required.filter(x => !body.includes(x));
            if (missing.length) core.setFailed("Missing PR sections: " + missing.join(", "));
            if (pr.base.ref !== "superfork/integration") core.setFailed("Superfork PRs must target superfork/integration");
            if (["dev", "superfork/integration"].includes(pr.head.ref)) core.setFailed("Do not develop directly on " + pr.head.ref);
