name: Superfork PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: ["superfork/integration"]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Superfork PR Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate Superfork PR body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const required = [
              "## Identity","## Source audit","## Objective / changes","## Explicitly not imported",
              "## Fallback / feature flag","## Attribution / license","## Security review",
              "## Tests","## State / handoff","## Risks / blockers / follow-ups"
            ];
            const missing = required.filter(x => !body.includes(x));
            if (missing.length) core.setFailed("Missing PR sections: " + missing.join(", "));
            if (pr.base.ref !== "superfork/integration") core.setFailed("Superfork PRs must target superfork/integration");
            if (["dev","superfork/integration"].includes(pr.head.ref)) core.setFailed("Do not develop directly on " + pr.head.ref);
            if (!/Feature ID\(s\):\s*[^\n]+/.test(body)) core.setFailed("Identity must declare Feature ID(s), or governance/N/A.");
            if (!/Gate:\s*(G(?:[0-9]|1[0-4])|governance\/N\/A)/i.test(body)) core.setFailed("Identity must declare Gate G0..G14 or governance/N/A.");

  state-handoff:
    name: Superfork State Handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install governance dependency
        run: python3 -m pip install -r scripts/superfork/requirements.txt
      - name: Verify exact PR scope and handoff
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/superfork/check_pr_scope.py --base "origin/$BASE_REF" --head-branch "$HEAD_REF"

  baseline-change:
    name: Superfork Baseline Change
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit review for additional debt or reduced test coverage
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const args = { owner: context.repo.owner, repo: context.repo.repo };
            async function file(path, ref) {
              try {
                const r = await github.rest.repos.getContent({...args, path, ref});
                return Buffer.from(r.data.content, 'base64').toString('utf8');
              } catch (e) { if (e.status === 404) return null; throw e; }
            }
            const raw = await file('integration/baseline_test_debt.json', pr.head.sha);
            if (!raw) return core.setFailed('Missing canonical baseline debt');
            const head = JSON.parse(raw);
            const before = await file('integration/baseline_test_debt.json', pr.base.sha);
            let expansion = false;
            if (before) {
              const base = JSON.parse(before);
              const ids = new Set(base.failures.map(x => x.test_id));
              expansion = head.failures.some(x => !ids.has(x.test_id)) || head.minimum_test_count < base.minimum_test_count;
              const oldInv = await file('integration/evidence/baseline-suite.json', pr.base.sha);
              const newInv = await file('integration/evidence/baseline-suite.json', pr.head.sha);
              if (oldInv) {
                if (!newInv) expansion = true;
                else {
                  const oldR = JSON.parse(oldInv).results, newR = JSON.parse(newInv).results;
                  expansion ||= Object.keys(oldR).some(k => !(k in newR) || (oldR[k] !== 'skipped' && newR[k] === 'skipped'));
                }
              }
            } else {
              // Bootstrap registration must include immutable clean-baseline observations.
              const evidence = await file('integration/evidence/baseline-suite.json', pr.head.sha);
              if (!evidence) return core.setFailed('Initial debt registration needs clean baseline evidence');
              const observed = JSON.parse(evidence);
              if (observed.tested_sha !== head.baseline_sha || observed.gradle_exit !== 0 || observed.tests < head.minimum_test_count)
                return core.setFailed('Initial baseline replay is incomplete or at the wrong SHA');
              if (head.failures.some(x => !['failure','error'].includes(observed.results[x.test_id])))
                return core.setFailed('Initial debt includes a test not observed failing on clean official baseline');
              if (!(pr.body || '').includes('## Baseline debt change')) return core.setFailed('Explain initial debt classification in PR');
            }
            if (!expansion) return core.info('No unreviewed growth or reduced coverage');
            if (!(pr.body || '').includes('## Baseline debt change')) return core.setFailed('Baseline changes need a dedicated PR section');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {...args, pull_number: pr.number});
            const comments = await github.paginate(github.rest.issues.listComments, {...args, issue_number: pr.number});
            const candidates = new Set([
              ...reviews.filter(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha).map(r => r.user.login),
              ...comments.filter(c => c.body.trim() === 'BASELINE_DEBT_APPROVED ' + pr.head.sha).map(c => c.user.login)
            ]);
            for (const username of candidates) {
              const p = await github.rest.repos.getCollaboratorPermissionLevel({...args, username});
              if (['admin','maintain'].includes(p.data.permission)) return core.info('Exact-head maintainer baseline review verified');
            }
            core.setFailed('Debt growth/coverage reduction requires exact-head maintainer approval; never auto-expand');
