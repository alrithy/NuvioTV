name: Superfork Test Build

# D066: an installable test build of the Superfork for real devices.
# - Package com.nuvio.tv.debug (beside official and release builds), signed with one fixed test key,
#   version code = app versionCode * 100000 + run number, so every build installs as an update.
# - Real backend configuration (Supabase / TV QR login, TMDB, Trakt, ...) from repository secrets.
# - Secrets are only written to files on the runner (never echoed); the artifact holds the APKs only.
# Runs on every push to superfork/integration, on demand, and on PRs whose title has [test-build].
on:
  push:
    branches: ["superfork/integration"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["superfork/integration"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superfork-test-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Superfork test build (com.nuvio.tv.debug)
    # Fork PRs never receive secrets; PRs build only when asked for.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.title, '[test-build]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_APP_ID: com.nuvio.tv.debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check secrets (names only)
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL_SECRET: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY_SECRET: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL_SECRET: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          SUPERFORK_TEST_KEYSTORE_BASE64: ${{ secrets.SUPERFORK_TEST_KEYSTORE_BASE64 }}
          SUPERFORK_TEST_KEYSTORE_PASSWORD: ${{ secrets.SUPERFORK_TEST_KEYSTORE_PASSWORD }}
          SUPERFORK_TEST_KEY_ALIAS: ${{ secrets.SUPERFORK_TEST_KEY_ALIAS }}
        run: |
          missing=()
          state() { if [ -n "${!1}" ]; then echo "present"; else echo "missing"; fi; }
          {
            echo "## Secrets (presence only)"
            for name in LOCAL_PROPERTIES_BASE64 LOCAL_DEV_PROPERTIES_BASE64 NUVIO_SUPABASE_URL_SECRET \
                NUVIO_SUPABASE_ANON_KEY_SECRET NUVIO_SUPABASE_FALLBACK_URL_SECRET SUPERFORK_TEST_KEYSTORE_BASE64 \
                SUPERFORK_TEST_KEYSTORE_PASSWORD SUPERFORK_TEST_KEY_ALIAS; do
              echo "- \`${name%_SECRET}\`: $(state "$name")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$SUPERFORK_TEST_KEYSTORE_BASE64" ] || missing+=(SUPERFORK_TEST_KEYSTORE_BASE64)
          [ -n "$SUPERFORK_TEST_KEYSTORE_PASSWORD" ] || missing+=(SUPERFORK_TEST_KEYSTORE_PASSWORD)
          [ -n "$SUPERFORK_TEST_KEY_ALIAS" ] || missing+=(SUPERFORK_TEST_KEY_ALIAS)
          if [ -z "$LOCAL_PROPERTIES_BASE64$LOCAL_DEV_PROPERTIES_BASE64" ] && \
             { [ -z "$NUVIO_SUPABASE_URL_SECRET" ] || [ -z "$NUVIO_SUPABASE_ANON_KEY_SECRET" ]; }; then
            missing+=("NUVIO_SUPABASE_URL + NUVIO_SUPABASE_ANON_KEY (or LOCAL_PROPERTIES_BASE64)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error title=Missing secrets::Add in Settings > Secrets and variables > Actions: %s (docs/GITHUB_ADMIN_CHECKLIST.md section E).\n' "${missing[*]}"
            exit 1
          fi

      - name: Write build configuration (not printed)
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL_SECRET: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY_SECRET: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL_SECRET: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          umask 077
          : > local.properties
          : > local.dev.properties
          [ -z "$LOCAL_PROPERTIES_BASE64" ] || printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          [ -z "$LOCAL_DEV_PROPERTIES_BASE64" ] || printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          # Individual secrets win over the files for the backend the test build talks to.
          if [ -n "$NUVIO_SUPABASE_URL_SECRET" ] && [ -n "$NUVIO_SUPABASE_ANON_KEY_SECRET" ]; then
            for f in local.properties local.dev.properties; do
              sed -i '/^NUVIO_SUPABASE_URL=/d;/^NUVIO_SUPABASE_ANON_KEY=/d;/^NUVIO_SUPABASE_FALLBACK_URL=/d' "$f"
              printf '\nNUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_ANON_KEY=%s\nNUVIO_SUPABASE_FALLBACK_URL=%s\n' \
                "$NUVIO_SUPABASE_URL_SECRET" "$NUVIO_SUPABASE_ANON_KEY_SECRET" "$NUVIO_SUPABASE_FALLBACK_URL_SECRET" >> "$f"
              grep -q '^AVATAR_PUBLIC_BASE_URL=.' "$f" || \
                printf 'AVATAR_PUBLIC_BASE_URL=%s/storage/v1/object/public/avatars\n' "${NUVIO_SUPABASE_URL_SECRET%/}" >> "$f"
            done
          fi
          # The debug build reads local.dev.properties first, then local.properties.
          has() { grep -Eq "^[[:space:]]*$1[[:space:]]*=[[:space:]]*[^[:space:]]" local.dev.properties local.properties; }
          for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY; do
            if ! has "$key"; then echo "::error title=Missing configuration::$key is empty in the configured secrets"; exit 1; fi
          done
          {
            echo "## Build configuration (presence only)"
            for key in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TMDB_API_KEY TRAKT_CLIENT_ID SIMKL_CLIENT_ID MDBLIST_CLIENT_ID TV_LOGIN_WEB_BASE_URL; do
              if has "$key"; then echo "- \`$key\`: set"; else echo "- \`$key\`: not set (default)"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the fixed test signing key (not printed)
        env:
          SUPERFORK_TEST_KEYSTORE_BASE64: ${{ secrets.SUPERFORK_TEST_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$SUPERFORK_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/superfork-test.jks"
          echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/superfork-test.jks" >> "$GITHUB_ENV"

      - name: Build com.nuvio.tv.debug
        env:
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.SUPERFORK_TEST_KEY_ALIAS }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.SUPERFORK_TEST_KEYSTORE_PASSWORD }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.SUPERFORK_TEST_KEY_PASSWORD || secrets.SUPERFORK_TEST_KEYSTORE_PASSWORD }}
        run: >-
          ./gradlew :app:assembleFullDebug
          -PsuperforkTestAppId="$TEST_APP_ID"
          -PsuperforkTestBuild="${{ github.run_number }}"
          --stacktrace

      - name: Verify the APK
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/full/debug
          apk="$out/app-full-universal-debug.apk"
          test -f "$apk"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          badging="$("$bt/aapt2" dump badging "$apk" | head -1)"
          package="$(sed -E "s/.*package: name='([^']+)'.*/\1/" <<<"$badging")"
          code="$(sed -E "s/.*versionCode='([^']+)'.*/\1/" <<<"$badging")"
          name="$(sed -E "s/.*versionName='([^']+)'.*/\1/" <<<"$badging")"
          [ "$package" = "$TEST_APP_ID" ] || { echo "::error::package is $package, expected $TEST_APP_ID"; exit 1; }
          "$bt/apksigner" verify "$apk"
          cert="$("$bt/apksigner" verify --print-certs "$apk" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)"
          [ -n "$cert" ] || { echo "::error::no signing certificate"; exit 1; }
          # The backend configuration reached the build (values not printed).
          cfg="$(find app/build/generated/source/buildConfig -path '*/full/debug/*' -name BuildConfig.java | head -1)"
          [ -n "$cfg" ] || { echo "::error::BuildConfig.java not found"; exit 1; }
          for field in SUPABASE_URL SUPABASE_ANON_KEY; do
            grep -Eq "String $field = \"[^\"]+\";" "$cfg" || { echo "::error::$field is empty in BuildConfig"; exit 1; }
          done
          (cd "$out" && sha256sum -- app-full-universal-debug.apk > SHA256SUMS.txt)
          {
            echo "## APK"
            echo "- Package: \`$package\`"
            echo "- Version: \`$name\` (code \`$code\`)"
            echo "- Signing certificate SHA-256: \`$cert\` (must stay the same across builds)"
            echo "- Backend configuration in BuildConfig: SUPABASE_URL and SUPABASE_ANON_KEY set"
            echo '```'
            cat "$out/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: superfork-test-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/full/debug/app-full-universal-debug.apk
            app/build/outputs/apk/full/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove secrets from the runner
        if: always()
        run: rm -f local.properties local.dev.properties "$RUNNER_TEMP/superfork-test.jks"
