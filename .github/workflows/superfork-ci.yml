name: Superfork CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["superfork/integration"]
  workflow_dispatch:
  push:
    branches: ["superfork/integration"]

permissions:
  contents: read

concurrency:
  group: superfork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Superfork Governance CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install governance dependency
        run: python3 -m pip install -r scripts/superfork/requirements.txt
      - name: Exercise governance regression cases
        run: python3 -m unittest discover -s scripts/superfork/tests
      - name: Validate canonical project state
        run: python3 scripts/superfork/validate_project_state.py
      - name: Font binary guard (no licensed font files or font data in Git)
        run: python3 scripts/superfork/private_fonts.py guard
      - name: Git whitespace check
        run: git diff --check

  full-debug:
    name: Superfork Full Debug CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare non-secret CI configuration
        run: touch local.properties local.dev.properties
      - name: Prepare CI signing config
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-debug.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - name: Private Thmanyah Sans input (docs/PRIVATE_FONTS.md)
        env:
          THMANYAH_SANS_B64_01: ${{ secrets.THMANYAH_SANS_B64_01 }}
          THMANYAH_SANS_B64_02: ${{ secrets.THMANYAH_SANS_B64_02 }}
          THMANYAH_SANS_B64_03: ${{ secrets.THMANYAH_SANS_B64_03 }}
          THMANYAH_SANS_B64_04: ${{ secrets.THMANYAH_SANS_B64_04 }}
          THMANYAH_SANS_B64_05: ${{ secrets.THMANYAH_SANS_B64_05 }}
          THMANYAH_SANS_B64_06: ${{ secrets.THMANYAH_SANS_B64_06 }}
          THMANYAH_SANS_B64_07: ${{ secrets.THMANYAH_SANS_B64_07 }}
          THMANYAH_SANS_B64_08: ${{ secrets.THMANYAH_SANS_B64_08 }}
          THMANYAH_SANS_B64_09: ${{ secrets.THMANYAH_SANS_B64_09 }}
          THMANYAH_SANS_B64_10: ${{ secrets.THMANYAH_SANS_B64_10 }}
        run: python3 scripts/superfork/private_fonts.py ci-prepare --policy optional

      - name: Full suite with exact baseline regression guard
        run: python3 scripts/superfork/run_full_unit_suite.py
      - name: Assemble full debug
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - name: Check the APK carries no standalone font file (docs/PRIVATE_FONTS.md)
        run: python3 scripts/superfork/private_fonts.py apk-check app/build/outputs/apk/full/debug/app-full-universal-debug.apk ${THMANYAH_FONT_DIR:+--embedded}

      - name: Upload full unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: superfork-full-unit-test-report-${{ github.event.pull_request.number || github.run_id }}
          path: build/superfork/test-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Remove the private font input and generated font resources
        if: always()
        run: python3 scripts/superfork/private_fonts.py ci-cleanup