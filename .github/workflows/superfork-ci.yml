name: Superfork CI

on:
  pull_request:
    branches:
      - superfork/integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superfork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Superfork Governance CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate project operating state
        run: python3 scripts/superfork/validate_project_state.py

  full-debug:
    name: Superfork Full Debug CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties
      - name: Prepare CI signing config
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-debug.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - name: Full debug unit tests
        run: |
          set +e
          ./gradlew :app:testFullDebugUnitTest --stacktrace
          code=$?
          printf '%s\n' "$code" > "$RUNNER_TEMP/superfork-unit-test-exit-code"
          exit 0
      - name: Enforce no new unit-test regressions
        run: python3 scripts/superfork/check_test_failures.py --exit-code-file "$RUNNER_TEMP/superfork-unit-test-exit-code"
      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: superfork-unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/testFullDebugUnitTest
            app/build/test-results/testFullDebugUnitTest
          if-no-files-found: warn
          retention-days: 14
